<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentJev · 决策工作台</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#1b2b3c;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dce3eb;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;letter-spacing:-.7px;margin:0}h1 span{color:#708094;font-size:14px;margin-left:14px;font-weight:400}.status{font-size:12px;color:#526477}main{max-width:1228px;margin:32px auto;padding:0 24px}.intro{margin-bottom:24px}.intro h2{font-size:30px;letter-spacing:-1px;margin:0 0 8px}.intro p{color:#617187;margin:0}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.panel{background:white;border:1px solid #dce3eb;border-radius:12px;padding:24px}label{display:block;font-weight:600;margin:18px 0 8px}label:first-child{margin-top:0}textarea{width:100%;resize:vertical;padding:13px;border:1px solid #cfd9e5;border-radius:7px;line-height:1.55;font:13px/1.6 ui-monospace,Consolas,monospace;color:#23334b;background:#fcfdff}textarea:focus{outline:2px solid #93b8ff;border-color:#4679db}#state{min-height:150px}#questions{min-height:290px}.examples{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}button{cursor:pointer;border-radius:6px;padding:9px 12px;border:1px solid #d4dfec;background:white;color:#405875}button:hover{background:#eff5ff}button.primary{background:#265bcb;color:white;border:0;padding:12px 22px;font-weight:600}button:disabled{opacity:.55;cursor:wait}.sub{font-size:12px;color:#78889b}.result{padding:16px 0;border-bottom:1px solid #edf0f4}.result:first-child{padding-top:0}.result h3{font-size:16px;margin:0 0 9px}.decision{font-weight:600;color:#2157b2;margin-bottom:12px;overflow-wrap:anywhere}.prob{display:grid;grid-template-columns:85px 1fr 60px;align-items:center;gap:10px;font-size:12px;margin:7px 0}.bar{background:#eaf0f9;height:8px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#447cd9}.prob b{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:70px 20px;color:#7b8ba0;text-align:center}#error{color:#a53434;white-space:pre-wrap;margin-top:12px}pre{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:14px;border-radius:7px}summary{cursor:pointer;color:#637792;font-size:13px;margin-top:18px}.hint{margin-top:20px;border-top:1px solid #edf0f4;padding-top:16px}.heading{display:flex;justify-content:space-between;align-items:center}.heading h2{font-size:18px;margin:0 0 14px}#usage{font-size:12px;color:#667e94;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:18px 24px}h1 span{display:none}main{margin:22px auto}.intro h2{font-size:25px}}
</style>
<header><h1>AgentJev <span>Typed Decisions · 训练版</span></h1><div class="status" id="health">正在连接模型…</div></header>
<main><div class="intro"><h2>给出状态，一次判断多个问题。</h2><p>真假判断 · 动态方案选择 · 有序评分。直接输出概率，供你的程序调用。</p></div>
<div class="grid"><section class="panel"><label for="state">当前状态</label><textarea id="state"></textarea>
<div class="examples"><button data-example="0">Agent 运行记录</button><button data-example="1">客户服务</button><button data-example="2">发票处理</button><button data-example="3">安全事件</button></div>
<label for="questions">问题与候选项</label><div class="sub">JSON 数组；可同时提交多种问题。候选描述应包含完整含义。</div><textarea id="questions" spellcheck="false"></textarea>
<div style="margin-top:18px"><button id="run" class="primary">运行决策</button></div><div id="error" role="alert"></div>
</section><section class="panel"><div class="heading"><h2>决策结果</h2><span class="sub" id="count"></span></div><div id="results"><div class="empty">提交左侧内容，查看每个选项的概率。</div></div><div id="usage"></div><details><summary>查看 API 请求与响应</summary><pre id="raw">POST /api/evaluate</pre></details><div class="sub hint">概率是模型的判断。自动提交、发布等动作仍应由你的程序结合实际验证结果执行。此页面只做决策，不执行候选动作。</div></section></div></main>
<script>
const examples=[{"state": "{\n  \"agent\": {\n    \"autonomy\": \"checkpointed\",\n    \"model\": \"internal-agent-v2\"\n  },\n  \"constraints\": [\n    \"Never modify production without an approved change ticket\"\n  ],\n  \"task\": \"Update every service to the patched logging library.\",\n  \"trace_summary\": {\n    \"constraint_violations\": 1,\n    \"duration_s\": 587.8,\n    \"irreversible_actions\": 1,\n    \"steps\": 12,\n    \"tool_errors\": 1\n  }\n}", "questions": [{"id": "action", "type": "choice", "question": "What should the observability system do with this trace?", "options": {"continue": "Let the agent proceed without interruption.", "human_review": "Queue this trace for a human to review.", "observe": "Keep running, but flag the trace for later sampling.", "stop": "Halt the agent now."}}, {"id": "needs_review", "type": "boolean", "question": "This trace requires human review.", "criteria": {"false": "No human attention is warranted.", "true": "A human should inspect this run."}}, {"id": "outcome", "type": "choice", "question": "How did this agent run turn out?", "options": {"failure": "The agent did not accomplish the task.", "harmful": "The agent took an action that caused damage or violated a constraint.", "partial": "The agent made progress but did not fully complete the task.", "success": "The agent completed the task correctly."}}, {"id": "risk", "type": "score", "question": "How risky was the agent's behaviour in this trace?", "levels": ["Benign: read-only or clearly safe actions.", "Low: routine writes within scope.", "Moderate: irreversible or out-of-scope actions.", "High: destructive, security-relevant, or policy-violating actions."]}, {"id": "urgency", "type": "score", "question": "How quickly does this trace need attention?", "levels": ["No time pressure; can wait indefinitely.", "Routine; handle within the normal queue.", "Elevated; should be handled within the same week.", "Critical; requires action within the same day."]}]}, {"state": "{\n  \"account\": {\n    \"lifetime_value_usd\": 133,\n    \"prior_tickets_90d\": 1,\n    \"seats\": 40,\n    \"tenure_months\": 8,\n    \"tier\": \"enterprise\"\n  },\n  \"orders\": [\n    {\n      \"amount_usd\": 149,\n      \"date\": \"2026-01-04\",\n      \"id\": \"A-23809\",\n      \"status\": \"settled\"\n    },\n    {\n      \"amount_usd\": 149,\n      \"date\": \"2026-01-20\",\n      \"id\": \"A-52054\",\n      \"status\": \"refunded\"\n    }\n  ],\n  \"thread\": [\n    {\n      \"role\": \"customer\",\n      \"text\": \"I just opened my enterprise delivery and it is the completely wrong item. After the last issue with the missing shipment, I guess I shouldn't be surprised that this is happening again.\"\n    },\n    {\n      \"role\": \"agent\",\n      \"text\": \"I am very sorry to hear that you received the incorrect item. Could you please provide the order number and describe the item you received instead?\"\n    },\n    {\n      \"role\": \"customer\",\n      \"text\": \"The order number is #88291. It was supposed to be the $149 hardware kit, but I got a box of cables instead. I need the correct items by Friday morning at the latest.\"\n    },\n    {\n      \"role\": \"agent\",\n      \"text\": \"Thank you for those details. I've noted the discrepancy regarding the hardware kit. Could you please send over a photo of the packing slip that was included in the box?\"\n    },\n    {\n      \"role\": \"customer\",\n      \"text\": \"I've attached the photo to this message. I really hope we can get this resolved before my event starts.\"\n    }\n  ]\n}", "questions": [{"id": "action", "type": "choice", "question": "What should the assistant do next with this conversation?", "options": {"answer_directly": "The assistant can resolve this itself with information it already has.", "close_no_action": "No further action is warranted; the matter is settled.", "escalate_to_human": "Hand off to a human agent with the appropriate authority.", "execute_refund": "Issue the refund or credit the customer is owed.", "request_information": "More detail is needed from the customer before anything can be done."}}, {"id": "category", "type": "choice", "question": "What is this customer conversation primarily about?", "options": {"account": "Login, plan changes, profile or access management.", "billing": "A charge, invoice, subscription or payment problem.", "delivery": "Shipping, fulfilment or delivery of a physical item.", "refund": "The customer is explicitly asking for money back.", "technical": "The product or service is not working as expected."}}, {"id": "churn_risk", "type": "score", "question": "How likely is this customer to stop doing business with us because of this interaction?", "levels": ["No sign of dissatisfaction.", "Mild frustration, but the relationship is intact.", "Clearly unhappy; repeat problems or explicit complaints.", "Imminent: threatening to cancel, dispute or leave."]}, {"id": "needs_human", "type": "boolean", "question": "This conversation requires a human agent rather than automated handling.", "criteria": {"false": "Automation can carry this to resolution.", "true": "A human must take over: judgement, authority or empathy is required."}}, {"id": "urgency", "type": "score", "question": "How time-sensitive is this conversation?", "levels": ["No time pressure; can wait indefinitely.", "Routine; handle within the normal queue.", "Elevated; should be handled within the same week.", "Critical; requires action within the same day."]}]}, {"state": "{\n  \"delivery\": {\n    \"condition\": \"accepted\",\n    \"date\": \"2026-03-06\",\n    \"received_qty\": 400\n  },\n  \"invoice\": {\n    \"currency\": \"USD\",\n    \"id\": \"INV-2026-2470\",\n    \"lines\": [\n      {\n        \"qty\": 450,\n        \"sku\": \"SKU-801\",\n        \"total_usd\": 65844.0,\n        \"unit_usd\": 146.32\n      }\n    ],\n    \"total_usd\": 65844.0,\n    \"vendor\": \"Vantage Materials\"\n  },\n  \"payment\": {\n    \"days_until_due\": 5,\n    \"discount_expires_in_days\": 2,\n    \"early_payment_discount_pct\": 2.0,\n    \"status\": \"scheduled\",\n    \"terms\": \"net 30\"\n  },\n  \"purchase_order\": {\n    \"freight_terms\": \"freight prepaid by vendor, not separately billable\",\n    \"id\": \"PO-9318\",\n    \"lines\": [\n      {\n        \"qty\": 400,\n        \"unit_usd\": 146.32\n      }\n    ],\n    \"total_usd\": 58528.0\n  },\n  \"vendor_history\": {\n    \"disputes_12m\": 0,\n    \"invoices_12m\": 22,\n    \"prior_invoice_ids\": [\n      \"INV-2026-9482\"\n    ]\n  }\n}", "questions": [{"id": "discrepancy_severity", "type": "score", "question": "How material is any discrepancy between the invoice, the order and the delivery?", "levels": ["None: everything reconciles.", "Trivial: rounding or a cosmetic difference.", "Moderate: a real difference worth confirming.", "Material: a large or unexplained difference."]}, {"id": "disposition", "type": "choice", "question": "How should this vendor invoice be dispositioned?", "options": {"approve": "Matches the order and delivery; approve for payment.", "hold": "Something needs confirming before payment; hold pending clarification.", "manual_review": "A human in finance must review the discrepancy.", "reject": "Should not be paid: duplicate, unauthorised or materially wrong."}}, {"id": "duplicate", "type": "boolean", "question": "This invoice appears to duplicate an invoice already submitted.", "criteria": {}}, {"id": "matches_order", "type": "boolean", "question": "The invoice reconciles with the purchase order and the recorded delivery.", "criteria": {"false": "There is a discrepancy against the order or the delivery.", "true": "Line items, quantities and amounts reconcile."}}, {"id": "urgency", "type": "score", "question": "How time-sensitive is processing this invoice?", "levels": ["No time pressure; can wait indefinitely.", "Routine; handle within the normal queue.", "Elevated; should be handled within the same week.", "Critical; requires action within the same day."]}]}, {"state": "{\n  \"alert\": {\n    \"description\": \"many failed authentications followed by a success\",\n    \"evidence\": \"From IP 203.0.113.45, the CI runner service recorded 27 failed password attempts between 2026-09-15T02:10:12Z and 2026-09-15T02:12:45Z. A subsequent successful authentication from the same source occurred at 2026-09-15T02:13:03Z with MFA verification.\",\n    \"rule\": \"brute_force\"\n  },\n  \"context\": {\n    \"asset_criticality\": \"low\",\n    \"change_window_active\": false,\n    \"source_on_allowlist\": false\n  },\n  \"history\": {\n    \"credential_rotation_days_ago\": 700,\n    \"distinct_countries_30d\": 4,\n    \"logins_30d\": 1039,\n    \"prior_alerts_90d\": 0\n  },\n  \"principal\": {\n    \"mfa_enrolled\": true,\n    \"name\": \"usr-deploy-415\",\n    \"privileges\": [\n      \"repo:read\"\n    ],\n    \"type\": \"ci_runner\"\n  }\n}", "questions": [{"id": "credential_compromise", "type": "boolean", "question": "The evidence indicates a credential or account has been compromised.", "criteria": {}}, {"id": "disposition", "type": "choice", "question": "How should this security alert be dispositioned?", "options": {"close_benign": "Expected, explainable activity; close without analyst time.", "contain": "Contain the host or account immediately; do not wait for triage.", "investigate": "Warrants an analyst opening an investigation.", "monitor": "Not clearly malicious, but worth watching for recurrence."}}, {"id": "severity", "type": "score", "question": "How severe is the potential impact if this alert is real?", "levels": ["Negligible: no access to anything sensitive.", "Low: limited access, easily reversed.", "Moderate: access to internal systems or non-public data.", "High: access to production, secrets or customer data.", "Critical: active compromise of crown-jewel systems."]}, {"id": "true_positive", "type": "boolean", "question": "This alert reflects genuinely malicious or unauthorised activity.", "criteria": {"false": "Benign activity, a misconfiguration, or a known false positive.", "true": "The underlying behaviour is malicious or unauthorised."}}, {"id": "urgency", "type": "score", "question": "How quickly must a responder act on this alert?", "levels": ["No time pressure; can wait indefinitely.", "Routine; handle within the normal queue.", "Elevated; should be handled within the same week.", "Critical; requires action within the same day."]}]}];
function parseState(t){try{const x=JSON.parse(t);if(x&&typeof x==='object')return x}catch{}return t}
const $=id=>document.getElementById(id);function load(i){$('state').value=examples[i].state;$('questions').value=JSON.stringify(examples[i].questions,null,2)}
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>load(+b.dataset.example));load(0);
fetch('/api/info').then(r=>r.json()).then(x=>{$('health').textContent=x.model+' · '+x.checkpoint+' · 已连接'}).catch(()=>{$('health').textContent='连接失败，请检查服务'});
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
$('run').onclick=async()=>{const button=$('run');$('error').textContent='';button.disabled=true;button.textContent='正在判断…';try{
const request={state:parseState($('state').value),questions:JSON.parse($('questions').value)};
const response=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');
$('results').replaceChildren();const answers=data.results[0].answers;for(const a of answers){const box=node('div',undefined,'result');box.append(node('h3',a.id+' · '+a.type));
let decision=a.type==='boolean'?(a.value?'TRUE':'FALSE'):a.type==='score'?'期望评分 '+a.score.toFixed(3):a.description;
box.append(node('div',decision,'decision'));for(const [key,p] of Object.entries(a.distribution)){const row=node('div',undefined,'prob');row.append(node('span',key));const bar=node('div',undefined,'bar');const fill=node('i');fill.style.width=(p*100)+'%';bar.append(fill);row.append(bar,node('b',(p*100).toFixed(2)+'%'));box.append(row)}$('results').append(box)}
$('count').textContent=answers.length+' 个问题';$('usage').textContent=data.usage.wall_ms+' ms · '+data.usage.candidate_paths+' 个候选 · 生成 token：0';$('raw').textContent=JSON.stringify({request,response:data},null,2);
}catch(e){$('error').textContent=e.message}finally{button.disabled=false;button.textContent='运行决策'}};
</script></html>
