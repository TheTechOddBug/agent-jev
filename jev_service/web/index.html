<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentJev · 决策工作台</title>
<style>
:root{font:15px/1.6 system-ui,sans-serif;color:#1b2b3c;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:white;border-bottom:1px solid #dce3eb;padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between}h1{font-size:23px;letter-spacing:-.7px;margin:0}h1 span{color:#708094;font-size:14px;margin-left:14px;font-weight:400}.status{font-size:12px;color:#526477}main{max-width:1228px;margin:32px auto;padding:0 24px}.intro{margin-bottom:24px}.intro h2{font-size:30px;letter-spacing:-1px;margin:0 0 8px}.intro p{color:#617187;margin:0}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.panel{background:white;border:1px solid #dce3eb;border-radius:12px;padding:24px}label{display:block;font-weight:600;margin:18px 0 8px}label:first-child{margin-top:0}textarea{width:100%;resize:vertical;padding:13px;border:1px solid #cfd9e5;border-radius:7px;line-height:1.55;font:13px/1.6 ui-monospace,Consolas,monospace;color:#23334b;background:#fcfdff}textarea:focus{outline:2px solid #93b8ff;border-color:#4679db}#state{min-height:150px}#questions{min-height:290px}.examples{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0}button{cursor:pointer;border-radius:6px;padding:9px 12px;border:1px solid #d4dfec;background:white;color:#405875}button:hover{background:#eff5ff}button.primary{background:#265bcb;color:white;border:0;padding:12px 22px;font-weight:600}button:disabled{opacity:.55;cursor:wait}.sub{font-size:12px;color:#78889b}.result{padding:16px 0;border-bottom:1px solid #edf0f4}.result:first-child{padding-top:0}.result h3{font-size:16px;margin:0 0 9px}.decision{font-weight:600;color:#2157b2;margin-bottom:12px;overflow-wrap:anywhere}.prob{display:grid;grid-template-columns:85px 1fr 60px;align-items:center;gap:10px;font-size:12px;margin:7px 0}.bar{background:#eaf0f9;height:8px;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#447cd9}.prob b{text-align:right;font-variant-numeric:tabular-nums}.empty{padding:70px 20px;color:#7b8ba0;text-align:center}#error{color:#a53434;white-space:pre-wrap;margin-top:12px}pre{font:12px/1.55 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f7fb;padding:14px;border-radius:7px}summary{cursor:pointer;color:#637792;font-size:13px;margin-top:18px}.hint{margin-top:20px;border-top:1px solid #edf0f4;padding-top:16px}.heading{display:flex;justify-content:space-between;align-items:center}.heading h2{font-size:18px;margin:0 0 14px}#usage{font-size:12px;color:#667e94;margin-top:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}header{padding:18px 24px}h1 span{display:none}main{margin:22px auto}.intro h2{font-size:25px}}
</style>
<header><h1>AgentJev <span>你的决策模型</span></h1><div class="status" id="health">正在连接模型…</div></header>
<main><div class="intro"><h2>给出状态，一次判断多个问题。</h2><p>真假判断 · 动态方案选择 · 有序评分。直接输出概率，供你的程序调用。</p></div>
<div class="grid"><section class="panel"><label for="state">当前状态</label><textarea id="state"></textarea>
<div class="examples"><button data-example="0">代码验收</button><button data-example="1">证据判断</button><button data-example="2">方案选择与评分</button></div>
<label for="questions">问题与候选项</label><div class="sub">JSON 数组；可同时提交多种问题。候选描述应包含完整含义。</div><textarea id="questions" spellcheck="false"></textarea>
<div style="margin-top:18px"><button id="run" class="primary">运行决策</button></div><div id="error" role="alert"></div>
</section><section class="panel"><div class="heading"><h2>决策结果</h2><span class="sub" id="count"></span></div><div id="results"><div class="empty">提交左侧内容，查看每个选项的概率。</div></div><div id="usage"></div><details><summary>查看 API 请求与响应</summary><pre id="raw">POST /api/evaluate</pre></details><div class="sub hint">概率是模型的判断。自动提交、发布等动作仍应由你的程序结合实际验证结果执行。此页面只做决策，不执行候选动作。</div></section></div></main>
<script>
const examples=[
{state:'TASK: Fix the parser.\nWORKING_STATE: A patch has been applied.\nVALIDATION: The full test suite ran on the current patch: 23 passed, 2 failed.\nRECENT_EVENTS: The agent said "all done", but the verifier reports two remaining assertion failures.',questions:[{id:'complete',type:'boolean',question:'Has the task been completed (full test suite passing)?'},{id:'submit',type:'boolean',question:'Should the agent stop now and submit the current code?'}]},
{state:'Claim: The new indexing strategy reduces query latency.\nEvidence: Under the same hardware and query workload, the old index had a median latency of 120 ms. The new index had a median latency of 75 ms across three repeated trials.',questions:[{id:'evidence',type:'choice',question:'What is the relationship between the evidence and the claim?',options:{support:'SUPPORT',contradict:'CONTRADICT',insufficient:'INSUFFICIENT'}}]},
{state:'TASK: Repair a Python function.\nWORKING_STATE: The source was modified after the last test run.\nVALIDATION: The previous revision passed tests, but the current revision has not been tested.\nRECENT_EVENTS: The change modifies a boundary condition.',questions:[{id:'next',type:'choice',question:'Which next action is most valuable right now?',options:{verify:'Run the test suite against the current changed source code.',submit:'Submit the changed source without testing it.',repeat:'Repeat the same source modification without examining it.'}},{id:'progress',type:'score',question:'How complete is the task based on the available verification evidence?',levels:['No working solution is available.','A candidate solution exists but current validation is incomplete.','The current solution is fully verified and ready to submit.']}]}
];
const $=id=>document.getElementById(id);function load(i){$('state').value=examples[i].state;$('questions').value=JSON.stringify(examples[i].questions,null,2)}
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>load(+b.dataset.example));load(0);
fetch('/api/info').then(r=>r.json()).then(x=>{$('health').textContent=x.model+' · '+x.checkpoint+' · 已连接'}).catch(()=>{$('health').textContent='连接失败，请检查服务'});
function node(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
$('run').onclick=async()=>{const button=$('run');$('error').textContent='';button.disabled=true;button.textContent='正在判断…';try{
const request={state:$('state').value,questions:JSON.parse($('questions').value)};
const response=await fetch('/api/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(request)});const data=await response.json();if(!response.ok)throw Error(data.error||'请求失败');
$('results').replaceChildren();const answers=data.results[0].answers;for(const a of answers){const box=node('div',undefined,'result');box.append(node('h3',a.id+' · '+a.type));
let decision=a.type==='boolean'?(a.value?'TRUE':'FALSE'):a.type==='score'?'期望评分 '+a.score.toFixed(3):a.description;
box.append(node('div',decision,'decision'));for(const [key,p] of Object.entries(a.distribution)){const row=node('div',undefined,'prob');row.append(node('span',key));const bar=node('div',undefined,'bar');const fill=node('i');fill.style.width=(p*100)+'%';bar.append(fill);row.append(bar,node('b',(p*100).toFixed(2)+'%'));box.append(row)}$('results').append(box)}
$('count').textContent=answers.length+' 个问题';$('usage').textContent=data.usage.wall_ms+' ms · '+data.usage.candidate_paths+' 个候选 · 生成 token：0';$('raw').textContent=JSON.stringify({request,response:data},null,2);
}catch(e){$('error').textContent=e.message}finally{button.disabled=false;button.textContent='运行决策'}};
</script></html>
